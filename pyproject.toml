# =============================================================================
# Versioning Guide for Contributors
# =============================================================================
# This project uses hatch-vcs for automatic versioning from git tags.
#
# To release a new version:
#   1. Ensure all changes are committed
#   2. Tag the release: git tag v1.2.3
#   3. Push the tag:  git push --tags
#
# Version format: vMAJOR.MINOR.PATCH (e.g., v1.0.2, v2.1.0-beta1)
# The version is written to src/Compocyte/_version.py during build.
# =============================================================================

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/Compocyte/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/Compocyte"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "Compocyte"
dynamic = ["version"]
authors = [
  { name="Thomas Walle", email="t.walle@dkfz-heidelberg.de" },
  { name="Christopher Beltz", email="christopher.beltz@dkfz-heidelberg.de" },
]
description = "Compocyte automates cell type annotation for scRNAseq data using a composite of hierarchically arranged classifiers."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  # Minimal install: importable package + sklearn-based inference.
  # Heavier backends live in [project.optional-dependencies] below.
  "anndata==0.12.11",
  "scanpy==1.12.1",
  "scikit-learn==1.8.0",
  "pooch==1.9.0",
]

[project.urls]
"Homepage" = "https://github.com/WALL-E-Lab/Compocyte"
"Bug Tracker" = "https://github.com/WALL-E-Lab/Compocyte/issues"

[project.optional-dependencies]
# torch backend: DenseTorch models, incl. all pretrained classifiers.
torch = [
  "torch==2.11.0",
]
# Gradient-boosted trees backend.
boosted = [
  "catboost==1.2.10",
]
# Class-balanced focal loss used by fit_torch.
focal = [
  "balanced-loss==0.1.1",
]
# Ontology knowledge base (tutorials / custom hierarchies).
trees = [
  "cytopus==1.3.4",
]
# Atlas-scale / visualization helpers.
atlas = [
  "dask==2026.3.0",
  "leidenalg==0.11.0",
  "pygraphviz==1.14",
]
tutorials = [
  "SEACells==0.3.3",
]
dev = [
  "pytest==9.0.3",
  "nbmake==1.5.5",
]
# Today's behaviour: everything, for Docker/CI/backward compatibility.
all = [
  "Compocyte[torch]",
  "Compocyte[boosted]",
  "Compocyte[focal]",
  "Compocyte[trees]",
  "Compocyte[atlas]",
  "Compocyte[tutorials]",
  "Compocyte[dev]",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.01.29",
    "sphinx-design>=0.5.0",
    "nbsphinx>=0.9.0",
    "myst-parser>=2.0.0",
    "ipython>=8.0.0",
]

# Plugin discovery for local classifiers. Built-ins resolve without optional
# dependencies; third parties (or future backends such as XGBoost/JAX) can
# register here without Compocyte importing them. See
# src/Compocyte/core/models/registry.py.
[project.entry-points."compocyte.classifiers"]
dense_torch = "Compocyte.core.models.dense_torch:DenseTorch"
logistic_regression = "Compocyte.core.models.log_reg:LogisticRegression"
dummy = "Compocyte.core.models.dummy_classifier:DummyClassifier"
boosted_trees = "Compocyte.core.models.trees:BoostedTrees"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
